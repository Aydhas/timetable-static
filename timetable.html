<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Timetable – TIET</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:     #002147;
      --navy-mid: #003366;
      --gold:     #C8932A;
      --gold-lt:  #E8B050;
      --white:    #FFFFFF;
      --off-white:#F5F7FA;
      --text:     #1A2535;
      --muted:    #6B7A90;
      --border:   #DDE3EC;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--off-white);
      min-height: 100vh;
      color: var(--text);
    }

    /* ── Top bar ──────────────────────────────────────────────────────── */
    .topbar {
      background: var(--navy);
      padding: 0 2rem;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .topbar-left { display: flex; align-items: center; gap: 1.5rem; }

    .back-btn {
      display: flex; align-items: center; gap: 6px;
      color: rgba(255,255,255,0.75);
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.15);
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .back-btn:hover { background: rgba(255,255,255,0.08); color: #fff; }

    .topbar-icon {
      width: 32px; height: 32px;
      background: var(--gold);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .topbar-title {
      color: var(--white);
      font-size: 0.95rem;
      font-weight: 600;
    }
    .topbar-title span {
      display: block;
      font-size: 0.7rem;
      font-weight: 400;
      color: rgba(255,255,255,0.55);
    }

    /* ── Quick links bar ──────────────────────────────────────────────── */
    .quickbar {
      background: var(--navy-mid);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      height: 40px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .quickbar::-webkit-scrollbar { display: none; }

    .quickbar-label {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      white-space: nowrap;
      margin-right: 0.25rem;
    }

    .quickbar-link {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.75);
      text-decoration: none;
      font-size: 0.73rem;
      font-weight: 500;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s;
    }
    .quickbar-link:hover { background: rgba(255,255,255,0.14); color: #fff; }
    .quickbar-link svg { opacity: 0.6; }

    /* ── Sub-header ───────────────────────────────────────────────────── */
    .subheader {
      background: var(--white);
      border-bottom: 3px solid var(--gold);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .subheader-group {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
    }

    .group-code {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--navy);
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: -0.01em;
    }

    .group-year {
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 500;
    }

    .subheader-pills { display: flex; gap: 8px; flex-wrap: wrap; }

    .pill {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
      letter-spacing: 0.04em;
    }
    .pill-l { background: rgba(0,198,92,0.12);  color: #0A8040; border: 1px solid rgba(0,198,92,0.3);  }
    .pill-p { background: rgba(67,70,248,0.1);  color: #2B2FCC; border: 1px solid rgba(67,70,248,0.25); }
    .pill-t { background: rgba(200,0,0,0.08);   color: #A00000; border: 1px solid rgba(200,0,0,0.2);   }
    .pill-w { background: rgba(200,147,42,0.12); color: #7A5000; border: 1px solid rgba(200,147,42,0.3); }

    /* ── Table wrapper ────────────────────────────────────────────────── */
    .table-wrapper {
      padding: 1.5rem 1rem;
    }

    /* ── Mobile: vertical card layout ────────────────────────────────── */
    table {
      border-collapse: separate;
      border-spacing: 6px;
      width: 100%;
    }

    td {
      border-radius: 8px;
      padding: 0;
      vertical-align: middle;
      text-align: center;
    }

    .cell-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 68px;
      padding: 8px 6px;
      gap: 2px;
    }

    /* ── Header cells ─────────────────────────────────────────────────── */
    .header-day {
      background: var(--navy) !important;
      color: #CFDDF7 !important;
      font-weight: 600;
      font-size: clamp(0.6rem, 1.3vw, 0.82rem);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .header-time {
      background: #1A3055 !important;
      color: #A8C0E0 !important;
      font-size: clamp(0.55rem, 1.1vw, 0.75rem);
      font-weight: 500;
      font-family: 'JetBrains Mono', monospace;
      white-space: nowrap;
    }

    /* ── Empty cells ──────────────────────────────────────────────────── */
    .cell-empty {
      background: var(--white);
      border: 1px solid var(--border);
    }

    /* ── Subject cells ────────────────────────────────────────────────── */
    .cell-l {
      background: rgba(0,198,92,0.1);
      border: 1px solid rgba(0,198,92,0.25);
    }
    .cell-p {
      background: rgba(67,70,248,0.1);
      border: 1px solid rgba(67,70,248,0.25);
    }
    .cell-t {
      background: rgba(200,0,0,0.07);
      border: 1px solid rgba(200,0,0,0.18);
    }

    td:not(.header-day):not(.header-time):not(.cell-empty):hover {
      filter: brightness(0.95);
      transform: scale(1.01);
      transition: transform 0.15s, filter 0.15s;
    }

    /* ── Cell text layers ─────────────────────────────────────────────── */
    .cell-code {
      font-size: clamp(0.58rem, 1.2vw, 0.82rem);
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
      word-break: break-word;
      font-family: 'JetBrains Mono', monospace;
    }

    .cell-name {
      font-size: clamp(0.46rem, 0.9vw, 0.68rem);
      font-weight: 400;
      color: var(--muted);
      line-height: 1.25;
      word-break: break-word;
      font-style: italic;
      max-width: 120px;
    }

    .cell-week {
      font-size: clamp(0.4rem, 0.8vw, 0.6rem);
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 8px;
      background: rgba(200,147,42,0.15);
      border: 1px solid rgba(200,147,42,0.35);
      color: #7A5000;
      letter-spacing: 0.03em;
      margin-top: 2px;
    }

    /* ── States ───────────────────────────────────────────────────────── */
    #tt-loading, #tt-error {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--muted);
    }

    .spinner {
      width: 28px; height: 28px;
      border: 2px solid var(--border);
      border-top-color: var(--navy);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #tt-error a { color: var(--navy); }

    .tt-disclaimer {
      text-align: center;
      font-size: 0.7rem;
      color: var(--muted);
      font-style: italic;
      padding: 0.75rem 1rem 0.25rem;
      line-height: 1.5;
      opacity: 0.75;
    }

    /* ── Mobile: rotate table to day-cards ───────────────────────────── */
    @media (max-width: 700px) {
      .topbar { padding: 0 1rem; }
      .topbar-title span { display: none; }
      .quickbar { padding: 0 1rem; }
      .subheader { padding: 0.75rem 1rem; }
      .group-code { font-size: 1.25rem; }
      .table-wrapper { padding: 0.75rem 0.5rem; }

      /* Hide the normal table on mobile */
      #tt-table { display: none; }

      /* Show day cards instead */
      #day-cards { display: flex; flex-direction: column; gap: 1rem; }

      .day-card {
        background: var(--white);
        border-radius: 12px;
        box-shadow: 0 2px 12px rgba(0,33,71,0.08);
        overflow: hidden;
      }

      .day-card-header {
        background: var(--navy);
        color: #CFDDF7;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 0.6rem 1rem;
      }

      .day-slot {
        display: flex;
        align-items: stretch;
        border-bottom: 1px solid var(--border);
      }
      .day-slot:last-child { border-bottom: none; }

      .slot-time {
        width: 80px;
        min-width: 80px;
        padding: 0.6rem 0.5rem;
        background: #F0F4FA;
        border-right: 1px solid var(--border);
        font-size: 0.62rem;
        font-family: 'JetBrains Mono', monospace;
        color: var(--muted);
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        line-height: 1.3;
      }

      .slot-content {
        flex: 1;
        padding: 0.6rem 0.75rem;
        display: flex;
        align-items: center;
        min-height: 54px;
      }
      .day-slot-gap .slot-content { min-height: 36px; padding: 0.4rem 0.75rem; }

      .day-slot-gap .slot-time {
        background: #F7F9FC;
        color: #B0BBCA;
      }
      .day-slot-gap .slot-content {
        background: #FAFBFD;
        min-height: 40px;
      }
      .slot-free {
        font-size: 0.68rem;
        color: #C4CDD8;
        font-weight: 500;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .slot-code {
        font-size: 0.8rem;
        font-weight: 600;
        font-family: 'JetBrains Mono', monospace;
        color: var(--text);
        display: block;
        line-height: 1.3;
      }

      .slot-name {
        font-size: 0.68rem;
        color: var(--muted);
        font-style: italic;
        display: block;
        line-height: 1.25;
        margin-top: 1px;
      }

      .slot-week {
        display: inline-block;
        font-size: 0.58rem;
        font-weight: 700;
        padding: 1px 6px;
        border-radius: 6px;
        background: rgba(200,147,42,0.15);
        border: 1px solid rgba(200,147,42,0.35);
        color: #7A5000;
        margin-top: 3px;
      }

      .slot-l { background: rgba(0,198,92,0.07); }
      .slot-p { background: rgba(67,70,248,0.07); }
      .slot-t { background: rgba(200,0,0,0.05); }
    }

    @media (min-width: 701px) {
      #day-cards { display: none; }
    }
  </style>
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <a href="index.html" class="back-btn">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path d="M19 12H5M12 5l-7 7 7 7"/>

    <div class="topbar-icon">

<nav class="quickbar">
  <span class="quickbar-label">Links</span>
  <a href="https://webkiosk.thapar.edu/" target="_blank" rel="noopener" class="quickbar-link">
    <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>

<div class="subheader" id="tt-subheader" style="display:none;">
  <div class="subheader-group">
    <span class="group-code" id="tt-group-code"></span>
    <span class="group-year" id="tt-group-year"></span>
  </div>
  <div class="subheader-pills">
    <span class="pill pill-l">Lecture</span>
    <span class="pill pill-p">Practical</span>

    <span class="pill pill-w">Alt. week</span>
  </div>
</div>

<div id="tt-loading">
  <div class="spinner"></div>
  Loading timetable…
</div>

<div id="tt-error" style="display:none;">
  Group not found. <a href="index.html">Go back</a>
</div>

<div class="table-wrapper" id="tt-container" style="display:none;">
  <table id="tt-table"></table>
  <div id="day-cards"></div>
  <p class="tt-disclaimer">
    Generated from the official timetable released by DOAA &amp; maintained as an independent student project.
  </p>
</div>

<script src="script.js"></script>
<script>
// Mobile day-card renderer — runs after script.js has populated tt-table
(function() {
  function buildDayCards(tableEl, container) {
    const rows = tableEl.querySelectorAll('tr');
    if (rows.length < 2) return;

    // First row = headers (Day names); first col of each data row = time
    const headerCells = rows[0].querySelectorAll('td');
    const timeSlots   = [];
    const dayData     = {}; // dayIndex -> [{time, code, name, week, type}]

    // Collect time labels from col 0 of data rows
    for (let r = 1; r < rows.length; r++) {
      const cells = rows[r].querySelectorAll('td');
      if (!cells.length) continue;
      timeSlots.push(cells[0]?.querySelector('.cell-inner')?.textContent?.trim() || '');
    }

    // For each day column (skip col 0 which is time)
    for (let c = 1; c < headerCells.length; c++) {
      const dayName = headerCells[c]?.querySelector('.cell-inner')?.textContent?.trim() || `Day ${c}`;
      dayData[c] = { name: dayName, slots: [] };
      for (let r = 1; r < rows.length; r++) {
        const cells = rows[r].querySelectorAll('td');
        const td    = cells[c];
        if (!td) continue;
        const code  = td.querySelector('.cell-code')?.textContent?.trim()  || '';
        const name  = td.querySelector('.cell-name')?.textContent?.trim()  || '';
        const week  = td.querySelector('.cell-week')?.textContent?.trim()  || '';
        const type  = td.classList.contains('cell-l') ? 'l'
                    : td.classList.contains('cell-p') ? 'p'
                    : td.classList.contains('cell-t') ? 't' : '';
        dayData[c].slots.push({ time: timeSlots[r - 1], code, name, week, type });
      }
    }

    // Render
    container.innerHTML = '';
    for (const [, day] of Object.entries(dayData)) {
      // Skip days with no classes at all
      if (!day.slots.some(s => s.code)) continue;

      const card = document.createElement('div');
      card.className = 'day-card';

      const hdr = document.createElement('div');
      hdr.className = 'day-card-header';
      hdr.textContent = day.name;
      card.appendChild(hdr);

      day.slots.forEach(slot => {
        const row = document.createElement('div');
        // Mark gap rows so they can be styled differently
        row.className = slot.code ? 'day-slot' : 'day-slot day-slot-gap';

        const timeEl = document.createElement('div');
        timeEl.className = 'slot-time';
        timeEl.textContent = slot.time;

        const contentEl = document.createElement('div');
        contentEl.className = `slot-content${slot.type ? ' slot-' + slot.type : ''}`;

        if (slot.code) {
          const inner = document.createElement('div');
          inner.innerHTML = `
            <span class="slot-code">${slot.code}</span>
            ${slot.name ? `<span class="slot-name">${slot.name}</span>` : ''}
            ${slot.week ? `<span class="slot-week">${slot.week}</span>` : ''}
          `;
          contentEl.appendChild(inner);
        } else {
          contentEl.innerHTML = '<span class="slot-free">Free</span>';
        }

        row.appendChild(timeEl);
        row.appendChild(contentEl);
        card.appendChild(row);
      });

      container.appendChild(card);
    }
  }

  // Hook into timetable ready — poll for tt-container becoming visible
  const obs = new MutationObserver(() => {
    const container = document.getElementById('tt-container');
    const tableEl   = document.getElementById('tt-table');
    const cardsEl   = document.getElementById('day-cards');
    if (container && container.style.display !== 'none' && tableEl && cardsEl) {
      obs.disconnect();
      // Small delay to let renderTable() finish
      setTimeout(() => buildDayCards(tableEl, cardsEl), 50);
    }
  });
  obs.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['style'] });
})();
</script>
