<body class="bg-dark">
  <div class="container">
    <h3 class="text-white home-title">
      Thapar University <br />Time Table
    </h3>

    <div id="custom-card" class="glass-card card">
      <!-- Loading state -->
      <div id="loading-state" class="py-4 text-center text-white" style="opacity:0.5;">
        Loading timetable data…
      </div>

      <!-- Main form (shown after data loads) -->
      <form id="form" style="display:none;">
        <div class="form-group mt-4 mb-3" style="padding:1rem; align-items:center;">
          <label class="text-white mb-2" style="font-size:0.9rem; opacity:0.7;">Search your group</label>
          <div class="search-wrapper">
            <input
              type="text"
              id="group-search"
              placeholder="e.g. 1A1A, 2B3C…"
              autocomplete="off"
              spellcheck="false"
            />
            <div id="search-results"></div>
          </div>
          <div id="selected-display"></div>
        </div>

        <div class="mb-3">
          <button type="submit" class="btn-get">Get Schedule</button>
        </div>
      </form>
    </div>
  </div>
